name: Build Windows Installer (PakPOS)

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build & Test Windows Executable
    runs-on: windows-latest
    timeout-minutes: 30

    env:
      # Required so PySide6 does not try to open a display in headless CI.
      # Must be set at job level so it is present for ALL steps, including
      # uv run pytest and uv run pyinstaller.
      QT_QPA_PLATFORM: offscreen

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "latest"

      - name: Install Dependencies
        run: |
          uv sync --frozen

      - name: Run Pytest Suite
        run: |
          uv run pytest tests/ -v

      - name: Build Executable with PyInstaller
        run: |
          uv run pyinstaller pakpos.spec

      - name: Install Inno Setup
        # Download the official Inno Setup installer directly from jrsoftware.org.
        # This avoids Chocolatey's slow package resolution and unreliable mirrors,
        # which caused builds to hang for 5+ minutes or fail silently.
        # The /VERYSILENT /SUPPRESSMSGBOXES flags perform a fully silent install.
        shell: powershell
        run: |
          $installer = "$env:TEMP\innosetup.exe"
          Invoke-WebRequest -Uri "https://jrsoftware.org/download.php/is.exe" `
            -OutFile $installer -UseBasicParsing
          Start-Process -FilePath $installer `
            -ArgumentList "/VERYSILENT /SUPPRESSMSGBOXES /NORESTART /SP-" `
            -Wait -NoNewWindow
          Write-Host "Inno Setup installed."

      - name: Compile Inno Setup Installer
        shell: cmd
        run: |
          "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" installer\pakpos.iss

      - name: Verify Installer Executable
        shell: powershell
        run: |
          if (!(Test-Path "installer_output\PakPOS-Setup.exe")) {
            Write-Error "PakPOS-Setup.exe was not generated by Inno Setup!"
            exit 1
          }
          $file = Get-Item "installer_output\PakPOS-Setup.exe"
          Write-Host "Installer generated successfully: $($file.Length) bytes"

      - name: Upload Installer Artifact
        uses: actions/upload-artifact@v4
        with:
          name: PakPOS-Setup-Windows
          path: installer_output/PakPOS-Setup.exe
