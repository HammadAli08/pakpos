name: Build Windows Installer (PakPOS)

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true


jobs:
  build:
    name: Build & Test Windows Executable
    runs-on: windows-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "latest"

      - name: Install Dependencies
        run: |
          uv sync --frozen

      - name: Run Pytest Suite
        run: |
          uv run pytest tests/ -v

      - name: Build Executable with PyInstaller
        run: |
          uv run pyinstaller pakpos.spec

      - name: Install Inno Setup
        # Chocolatey is pre-installed on all GitHub-hosted Windows runners.
        # Installing explicitly makes the build deterministic regardless of
        # what the runner image happens to pre-install in the future.
        run: choco install innosetup -y

      - name: Compile Inno Setup Installer
        shell: cmd
        run: |
          "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" installer\pakpos.iss

      - name: Upload Installer Artifact
        uses: actions/upload-artifact@v4
        with:
          name: PakPOS-Setup-Windows
          path: installer_output/PakPOS-Setup.exe
