name: Build Windows Installer (PakPOS)

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build & Test Windows Executable
    runs-on: windows-latest
    timeout-minutes: 30

    env:
      # Required so PySide6 does not try to open a display in headless CI.
      # Set at job level so it is present for ALL steps (pytest, pyinstaller, etc.).
      QT_QPA_PLATFORM: offscreen

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "latest"

      - name: Print Build Environment Diagnostics
        shell: powershell
        run: |
          Write-Host "=== Build Diagnostics ==="
          Write-Host "Python Version:"
          python --version
          Write-Host "uv Version:"
          uv --version
          Write-Host "Working Directory: $PWD"

      - name: Install Dependencies
        run: |
          uv sync --frozen

      - name: Verify Windows Dependencies
        shell: powershell
        run: |
          Write-Host "Verifying runtime & build dependencies in virtual environment..."
          uv run python -c "import PySide6; print('PySide6:', PySide6.__version__)"
          uv run python -c "import sqlalchemy; print('SQLAlchemy:', sqlalchemy.__version__)"
          uv run python -c "import win32print; print('win32print loaded successfully')"
          uv run python -c "import PyInstaller; print('PyInstaller:', PyInstaller.__version__)"

      - name: Run Pytest Suite
        run: |
          uv run pytest tests/ -v

      - name: Build Executable with PyInstaller
        run: |
          uv run pyinstaller pakpos.spec --noconfirm

      - name: Verify PyInstaller Output
        shell: powershell
        run: |
          $exePath = "dist\PakPOS\PakPOS.exe"
          if (!(Test-Path $exePath)) {
            Write-Error "PyInstaller output $exePath was not found!"
            exit 1
          }
          $file = Get-Item $exePath
          Write-Host "PyInstaller frozen application built successfully: $($file.Length) bytes"
          Get-ChildItem -Path "dist\PakPOS" | Select-Object Name, Length

      - name: Install Inno Setup
        run: choco install innosetup -y --no-progress

      - name: Locate & Compile Inno Setup Installer
        shell: powershell
        run: |
          $iscc = Get-Command "iscc.exe" -ErrorAction SilentlyContinue | Select-Object -ExpandProperty Path
          if (-not $iscc) {
              $possiblePaths = @(
                  "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe",
                  "${env:ProgramFiles}\Inno Setup 6\ISCC.exe",
                  "C:\Program Files (x86)\Inno Setup 6\ISCC.exe",
                  "C:\Program Files\Inno Setup 6\ISCC.exe"
              )
              foreach ($path in $possiblePaths) {
                  if (Test-Path $path) {
                      $iscc = $path
                      break
                  }
              }
          }
          if (-not $iscc) {
              Write-Error "ISCC.exe (Inno Setup Compiler) could not be found!"
              exit 1
          }
          Write-Host "Found ISCC.exe at: $iscc"
          & $iscc installer\pakpos.iss
          if ($LASTEXITCODE -ne 0) {
              Write-Error "Inno Setup compilation failed with exit code $LASTEXITCODE"
              exit $LASTEXITCODE
          }

      - name: Verify Installer Executable
        shell: powershell
        run: |
          $installerPath = "installer_output\PakPOS-Setup.exe"
          if (!(Test-Path $installerPath)) {
            Write-Error "PakPOS-Setup.exe was not generated by Inno Setup!"
            Get-ChildItem -Path "."
            if (Test-Path "installer_output") {
              Get-ChildItem -Path "installer_output"
            }
            exit 1
          }
          $file = Get-Item $installerPath
          Write-Host "Installer generated successfully: $installerPath ($($file.Length) bytes)"

      - name: Upload Installer Artifact
        uses: actions/upload-artifact@v4
        with:
          name: PakPOS-Windows-Installer
          path: installer_output/PakPOS-Setup.exe
