[project]
name = "pakpos"
version = "1.0.0"
description = "PakPOS — Offline-first Windows POS for Pakistani retail shops"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "PakPOS Team" }]

dependencies = [
    "pyside6>=6.7.0",
    "sqlalchemy>=2.0.0",
    "alembic>=1.13.0",
    "bcrypt>=4.0.0",
    "reportlab>=4.0.0",
    "openpyxl>=3.1.0",
    "python-escpos>=3.0.0",
    "pillow>=10.0.0",
    # win32print is used by WindowsPrinterAdapter — Windows only
    "pywin32>=306; sys_platform == 'win32'",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-qt>=4.2.0",
    "pytest-cov>=4.1.0",
    "faker>=20.0.0",
]
build = [
    "pyinstaller>=6.0.0",
]

[project.scripts]
pakpos = "pakpos.main:main"
pakpos-seed = "scripts.seed_demo_data:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["pakpos"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short"

[tool.uv]
dev-dependencies = [
    "pytest>=7.4.0",
    "pytest-qt>=4.2.0",
    "pytest-cov>=4.1.0",
    "faker>=20.0.0",
    "pyinstaller>=6.0.0",
]
